<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>
<style>
  :root {
    --bg: #101418;
    --panel: #171d24;
    --text: #e8ecef;
    --muted: #8a95a1;
    --accent: #4fb2a6;
    --border: #262e37;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1.25rem;
  }

  .card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem;
  }

  .nav {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .nav-link.active {
    color: var(--accent);
  }

  .nav-link:hover {
    color: var(--text);
  }

  .name {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .role {
    color: var(--accent);
    font-weight: 500;
    margin-top: 0.25rem;
  }

  .bio {
    color: var(--muted);
    margin-top: 1.25rem;
    max-width: 46ch;
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  .skill {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    font-size: 0.85rem;
    color: var(--text);
  }

  .btn {
    margin-top: 2rem;
    background: var(--accent);
    color: #0b0f12;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn:hover { opacity: 0.9; }

  .msg {
    margin-top: 1rem;
    color: var(--accent);
    font-size: 0.9rem;
    min-height: 1.2rem;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>

  <div class="card">
    <nav class="nav">
      <a href="index.html" class="nav-link active">Profil</a>
      <a href="proyek.html" class="nav-link">Proyek</a>
    </nav>

    <div class="name">AGUNG FIRMANSYAH</div>
    <div class="role">Mahasiswa Informatika</div>

    <p class="bio">
     Aku belajar ini untuk masa depan lebih cerah AAUUUUU
    </p>

    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">Python</span>
    </div>

    <button class="btn" id="sapaBtn">Klik Uuntuk di sapa</button>
    <div class="msg" id="pesan"></div>
  </div>

  <footer>WEB INI DI BUAT SEBAGAI SARANA BELAJAR SAYA AUUU</footer>

  <script>
    const tombol = document.getElementById("sapaBtn");
    const pesan = document.getElementById("pesan");
    let jumlahKlik = 0;

    tombol.addEventListener("click", () => {
      jumlahKlik++;
      pesan.textContent = `Hai Auuu-${jumlahKlik} dari AGUNG GANTENG.`;
    });
  </script>

</body>
</html>
